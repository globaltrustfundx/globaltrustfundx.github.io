<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Global Trust Fund</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
    }

    header {
      background: #0D1B2A;
      border-bottom: 1px solid #203246;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #D4AF37;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      color: #FFFFFF;
      background: transparent;
      border: 1px solid #D4AF37;
      border-radius: 7px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p,
    .label {
      color: #B8C4D4;
    }

    .balance-card,
    .card,
    .activity {
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 12px;
      padding: 24px;
    }

    .balance-card {
      margin-bottom: 22px;
    }

    .balance {
      color: #D4AF37;
      font-size: 40px;
      font-weight: bold;
      margin-top: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card h3 {
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 20px;
      font-weight: bold;
    }

    .section {
      margin-top: 30px;
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .activity {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #203246;
      font-size: 14px;
    }

    th {
      color: #D4AF37;
    }

    td {
      color: #B8C4D4;
    }

    .message {
      color: #B8C4D4;
      padding: 12px 0;
      line-height: 1.6;
    }

    .error {
      color: #FF9999;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .balance {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Global Trust Fund</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<main class="container">

  <div class="welcome">
    <h1>Welcome, <span id="userName">Loading...</span></h1>
    <p>Here's an overview of your account.</p>
  </div>

  <div class="balance-card">
    <div class="label">Account Balance</div>
    <div class="balance" id="balance">Loading...</div>
  </div>

  <div class="cards">

    <div class="card">
      <h3>Account Status</h3>
      <p id="status">Loading...</p>
    </div>

    <div class="card">
      <h3>Investment Plan</h3>
      <p id="plan">Loading...</p>
    </div>

    <div class="card">
      <h3>Account Currency</h3>
      <p id="currency">Loading...</p>
    </div>

  </div>

  <div class="section">
    <h2>Recent Activity</h2>

    <div class="activity">
      <div id="activityMessage" class="message">
        Loading transactions...
      </div>

      <table id="activityTable" style="display:none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="activityRows"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://xywwhnijjtipghhebnjk.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function loadDashboard() {
    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if (authError || !user) {
      window.location.href = "login.html";
      return;
    }

    document.getElementById("userName").textContent =
      user.user_metadata?.full_name ||
      user.email?.split("@")[0] ||
      "User";

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("balance, status, plan, currency, is_admin")
        .eq("id", user.id)
        .single();

    if (profileError || !profile) {
      document.getElementById("balance").textContent =
        "Unavailable";

      document.getElementById("status").textContent =
        "Unavailable";

      document.getElementById("plan").textContent =
        "Unavailable";

      document.getElementById("currency").textContent =
        "Unavailable";

      document.getElementById("activityMessage").textContent =
        "We couldn't load your account information. Please contact support.";

      return;
    }

    if (profile.is_admin === true) {
      window.location.href = "login.html";
      return;
    }

    const currency = profile.currency || "USD";

    document.getElementById("balance").textContent =
      formatMoney(profile.balance, currency);

    document.getElementById("status").textContent =
      profile.status || "Active";

    document.getElementById("plan").textContent =
      profile.plan || "Standard";

    document.getElementById("currency").textContent =
      currency;

    await loadTransactions(user.id, currency);
  }

  function formatMoney(amount, currency) {
    const value = Number(amount);

    if (!Number.isFinite(value)) {
      return "Unavailable";
    }

    try {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: currency,
        minimumFractionDigits: 2
      }).format(value);
    } catch (error) {
      return value.toFixed(2) + " " + currency;
    }
  }

  async function loadTransactions(userId, currency) {
    const { data, error } = await supabaseClient
      .from("transactions")
      .select("created_at, transaction_type, description, amount")
      .eq("client_id", userId)
      .order("created_at", { ascending: false })
      .limit(10);

    const message = document.getElementById("activityMessage");

    if (error) {
      message.textContent =
        "Unable to load recent activity. Please try again later.";
      return;
    }

    if (!data || data.length === 0) {
      message.textContent = "No recent activity to display.";
      return;
    }

    document.getElementById("activityTable").style.display = "table";
    message.style.display = "none";

    const rows = document.getElementById("activityRows");

    data.forEach(function(transaction) {
      const row = document.createElement("tr");

      const date = new Date(transaction.created_at);

      const dateCell = document.createElement("td");
      dateCell.textContent = isNaN(date.getTime())
        ? "Unknown date"
        : date.toLocaleDateString();

      const typeCell = document.createElement("td");
      typeCell.textContent = transaction.transaction_type || "Transaction";

      const descriptionCell = document.createElement("td");
      descriptionCell.textContent = transaction.description || "—";

      const amountCell = document.createElement("td");
      amountCell.textContent =
        formatMoney(transaction.amount, currency);

      row.appendChild(dateCell);
      row.appendChild(typeCell);
      row.appendChild(descriptionCell);
      row.appendChild(amountCell);

      rows.appendChild(row);
    });
  }

  async function logout() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert("Unable to log out. Please try again.");
      return;
    }

    window.location.href = "login.html";
  }

  loadDashboard();
</script>

</body>
</html>
