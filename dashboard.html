<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Global Trust Fund</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
    }

    header {
      background: #0D1B2A;
      border-bottom: 1px solid #203246;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #D4AF37;
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      color: #FFFFFF;
      background: transparent;
      border: 1px solid #D4AF37;
      border-radius: 7px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p,
    .label {
      color: #B8C4D4;
    }

    .balance-card,
    .card,
    .activity {
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 12px;
      padding: 24px;
    }

    .balance-card {
      margin-bottom: 22px;
    }

    .balance {
      color: #D4AF37;
      font-size: 40px;
      font-weight: bold;
      margin-top: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .card h3 {
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 20px;
      font-weight: bold;
    }

    .section {
      margin-top: 30px;
    }

    .section h2 {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .activity {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 500px;
    }

    th, td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #203246;
      font-size: 14px;
    }

    th {
      color: #D4AF37;
    }

    td {
      color: #B8C4D4;
    }

    .message {
      color: #B8C4D4;
      padding: 12px 0;
      line-height: 1.6;
    }

    .error {
      color: #FF9999;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .balance {
        font-size: 32px;
      }

      header {
        padding: 15px;
      }
    }
  </style></head><body><header>
  <div class="logo">Global Trust Fund</div>
  <button class="logout" id="logoutButton" type="button">Logout</button>
</header><main class="container">  <div class="welcome">
    <h1>Welcome, <span id="userName">Loading...</span></h1>
    <p>Here's an overview of your account.</p>
  </div>  <div class="balance-card">
    <div class="label">Account Balance</div>
    <div class="balance" id="balance">Loading...</div>
  </div>  <div class="cards"><div class="card">
  <h3>Account Status</h3>
  <p id="status">Loading...</p>
</div>

<div class="card">
  <h3>Investment Plan</h3>
  <p id="plan">Loading...</p>
</div>

<div class="card">
  <h3>Account Currency</h3>
  <p id="currency">Loading...</p>
</div>

  </div>  <div class="section">
    <h2>Recent Activity</h2><div class="activity">

  <div id="activityMessage" class="message">
    Loading transactions...
  </div>

  <table id="activityTable" style="display:none;">
    <thead>
      <tr>
        <th>Date</th>
        <th>Type</th>
        <th>Description</th>
        <th>Amount</th>
      </tr>
    </thead>

    <tbody id="activityRows"></tbody>
  </table>

</div>

  </div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";

const SUPABASE_URL =
  "https://xywwhnijjtipghhebnjk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const elements = {
  userName: document.getElementById("userName"),
  balance: document.getElementById("balance"),
  status: document.getElementById("status"),
  plan: document.getElementById("plan"),
  currency: document.getElementById("currency"),
  activityMessage: document.getElementById("activityMessage"),
  activityTable: document.getElementById("activityTable"),
  activityRows: document.getElementById("activityRows"),
  logoutButton: document.getElementById("logoutButton")
};

function formatMoney(amount, currency) {
  const value = Number(amount);

  if (!Number.isFinite(value)) {
    return "Unavailable";
  }

  try {
    return new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: currency || "USD",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(value);
  } catch (error) {
    return value.toFixed(2) + " " + (currency || "USD");
  }
}

function showDashboardError(error) {
  console.error("Dashboard error:", error);

  elements.balance.textContent = "Unavailable";
  elements.status.textContent = "Unavailable";
  elements.plan.textContent = "Unavailable";
  elements.currency.textContent = "Unavailable";

  elements.activityMessage.style.display = "block";
  elements.activityMessage.classList.add("error");

  elements.activityMessage.textContent =
    "Account information could not be loaded. " +
    (error.message || "Please refresh the page or contact support.");
}

async function loadTransactions(userId, currency) {
  try {
    const { data, error } = await supabaseClient
      .from("transactions")
      .select("created_at, transaction_type, description, amount")
      .eq("client_id", userId)
      .order("created_at", { ascending: false })
      .limit(10);

    if (error) {
      throw error;
    }

    elements.activityRows.replaceChildren();

    if (!data || data.length === 0) {
      elements.activityTable.style.display = "none";
      elements.activityMessage.style.display = "block";
      elements.activityMessage.textContent =
        "No recent activity to display.";
      return;
    }

    data.forEach(function(transaction) {
      const row = document.createElement("tr");

      const date = new Date(transaction.created_at);

      const values = [
        isNaN(date.getTime())
          ? "Unknown date"
          : date.toLocaleDateString(),

        transaction.transaction_type || "Transaction",
        transaction.description || "—",
        formatMoney(transaction.amount, currency)
      ];

      values.forEach(function(value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });

      elements.activityRows.appendChild(row);
    });

    elements.activityTable.style.display = "table";
    elements.activityMessage.style.display = "none";

  } catch (error) {
    console.error("Transaction loading error:", error);

    elements.activityTable.style.display = "none";
    elements.activityMessage.style.display = "block";
    elements.activityMessage.textContent =
      "Unable to load recent activity.";
  }
}

async function loadDashboard() {
  try {
    elements.balance.textContent = "Loading...";
    elements.status.textContent = "Loading...";
    elements.plan.textContent = "Loading...";
    elements.currency.textContent = "Loading...";

    const { data: { session }, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    if (!session || !session.user) {
      window.location.replace("login.html");
      return;
    }

    const user = session.user;

    elements.userName.textContent =
      user.user_metadata?.full_name ||
      user.email?.split("@")[0] ||
      "User";

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("balance, status, plan, currency, is_admin")
        .eq("id", user.id)
        .maybeSingle();

    if (profileError) {
      throw profileError;
    }

    if (!profile) {
      throw new Error(
        "No profile was found for this account. Please contact support."
      );
    }

    if (profile.is_admin === true) {
      window.location.replace("login.html");
      return;
    }

    const currency = profile.currency || "USD";

    elements.balance.textContent =
      formatMoney(profile.balance, currency);

    elements.status.textContent =
      profile.status || "Active";

    elements.plan.textContent =
      profile.plan || "Standard";

    elements.currency.textContent =
      currency;

    await loadTransactions(user.id, currency);

  } catch (error) {
    showDashboardError(error);
  }
}

async function logout() {
  elements.logoutButton.disabled = true;
  elements.logoutButton.textContent = "Logging out...";

  try {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      throw error;
    }

    window.location.replace("login.html");

  } catch (error) {
    alert(error.message || "Unable to log out. Please try again.");

    elements.logoutButton.disabled = false;
    elements.logoutButton.textContent = "Logout";
  }
}

elements.logoutButton.addEventListener("click", logout);

loadDashboard();
</script></body>
</html>
