<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Global Trust Fund</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #07111F; color: #FFFFFF; min-height: 100vh; }
    header { background: #0D1B2A; border-bottom: 1px solid #203246; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: #D4AF37; font-size: 22px; font-weight: bold; }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .home-link, .logout { color: #FFFFFF; background: transparent; border: 1px solid #D4AF37; border-radius: 7px; padding: 9px 16px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
    .home-link:hover, .logout:hover { background: #D4AF37; color: #07111F; }

    .container { max-width: 1100px; margin: auto; padding: 35px 20px; }
    .welcome { margin-bottom: 28px; }
    .welcome h1 { font-size: 28px; margin-bottom: 8px; }
    .welcome p, .label { color: #B8C4D4; }

    .balance-card, .card, .activity { background: #0D1B2A; border: 1px solid #203246; border-radius: 12px; padding: 24px; }
    .balance-card { margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .balance { color: #D4AF37; font-size: 40px; font-weight: bold; margin-top: 10px; }

    .withdraw-btn { background: #D4AF37; color: #07111F; border: none; border-radius: 8px; padding: 12px 20px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .withdraw-btn:hover { opacity: 0.9; transform: translateY(-2px); }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card h3 { color: #B8C4D4; font-size: 14px; margin-bottom: 12px; }
    .card p { font-size: 20px; font-weight: bold; }

    .section { margin-top: 30px; }
    .section h2 { margin-bottom: 15px; font-size: 21px; }
    .activity { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th, td { text-align: left; padding: 13px 10px; border-bottom: 1px solid #203246; font-size: 14px; }
    th { color: #D4AF37; }
    td { color: #B8C4D4; }
    .message { color: #B8C4D4; padding: 12px 0; line-height: 1.6; }

    /* MODAL STYLES */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .modal { background: #0D1B2A; border: 1px solid #D4AF37; border-radius: 12px; width: 100%; max-width: 420px; padding: 30px; }
    .modal h2 { color: #D4AF37; margin-bottom: 15px; font-size: 22px; }
    .modal .field { margin-bottom: 15px; }
    .modal label { display: block; color: #B8C4D4; font-size: 13px; margin-bottom: 5px; }
    .modal select, .modal input { width: 100%; padding: 11px; background: #07111F; color: #FFF; border: 1px solid #203246; border-radius: 6px; outline: none; }
    .modal select:focus, .modal input:focus { border-color: #D4AF37; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn-submit { flex: 1; background: #D4AF37; color: #07111F; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .modal-btn-cancel { flex: 1; background: transparent; color: #B8C4D4; border: 1px solid #203246; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    @media (max-width: 700px) {
      .cards { grid-template-columns: 1fr; }
      .balance { font-size: 32px; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Global Trust Fund</div>
  <div class="nav-actions">
    <a href="index.html" class="home-link">Home</a>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<main class="container">

  <div class="welcome">
    <h1>Welcome, <span id="userName">Loading...</span></h1>
    <p>Here's an overview of your account.</p>
  </div>

  <div class="balance-card">
    <div>
      <div class="label">Account Balance</div>
      <div class="balance" id="balance">Loading...</div>
    </div>
    <div>
      <button class="withdraw-btn" onclick="openWithdrawModal()">⚡ Crypto Withdrawal</button>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Account Status</h3>
      <p id="status">Loading...</p>
    </div>
    <div class="card">
      <h3>Investment Plan</h3>
      <p id="plan">Loading...</p>
    </div>
    <div class="card">
      <h3>Account Currency</h3>
      <p id="currency">Loading...</p>
    </div>
  </div>

  <div class="section">
    <h2>Recent Activity</h2>
    <div class="activity">
      <div id="activityMessage" class="message">Loading transactions...</div>
      <table id="activityTable" style="display:none;">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Description</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="activityRows"></tbody>
      </table>
    </div>
  </div>

</main>

<!-- WITHDRAWAL MODAL -->
<div class="modal-overlay" id="withdrawModal">
  <div class="modal">
    <h2>Crypto Withdrawal</h2>
    <form onsubmit="submitWithdrawal(event)">
      <div class="field">
        <label>Select Cryptocurrency</label>
        <select id="cryptoType" required>
          <option value="USDT">USDT (Tether - TRC20/ERC20)</option>
          <option value="BTC">Bitcoin (BTC)</option>
          <option value="ETH">Ethereum (ETH)</option>
        </select>
      </div>
      <div class="field">
        <label>Withdrawal Amount</label>
        <input type="number" id="withdrawAmount" placeholder="Enter amount" step="0.01" min="1" required>
      </div>
      <div class="field">
        <label>Destination Wallet Address</label>
        <input type="text" id="walletAddress" placeholder="Paste wallet address here" required>
      </div>
      <div class="modal-buttons">
        <button type="submit" class="modal-btn-submit">Confirm Withdrawal</button>
        <button type="button" class="modal-btn-cancel" onclick="closeWithdrawModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://xywwhnijjtipghhebnjk.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let userGlobalId = null;

  async function loadDashboard() {
    const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

    if (authError || !user) {
      window.location.href = "login.html";
      return;
    }

    userGlobalId = user.id;

    document.getElementById("userName").textContent =
      user.user_metadata?.full_name || user.email?.split("@")[0] || "User";

    const { data: profile, error: profileError } = await supabaseClient
      .from("profiles")
      .select("balance, status, plan, currency, is_admin")
      .eq("id", user.id)
      .single();

    if (profileError || !profile) {
      document.getElementById("balance").textContent = "Unavailable";
      document.getElementById("status").textContent = "Unavailable";
      document.getElementById("plan").textContent = "Unavailable";
      document.getElementById("currency").textContent = "Unavailable";
      document.getElementById("activityMessage").textContent = "We couldn't load your account information. Please contact support.";
      return;
    }

    if (profile.is_admin === true) {
      window.location.href = "login.html";
      return;
    }

    const currency = profile.currency || "USD";
    document.getElementById("balance").textContent = formatMoney(profile.balance, currency);
    document.getElementById("status").textContent = profile.status || "Active";
    document.getElementById("plan").textContent = profile.plan || "Standard";
    document.getElementById("currency").textContent = currency;

    await loadTransactions(user.id, currency);
  }

  function formatMoney(amount, currency) {
    const value = Number(amount);
    if (!Number.isFinite(value)) return "Unavailable";
    try {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: currency, minimumFractionDigits: 2 }).format(value);
    } catch (error) {
      return value.toFixed(2) + " " + currency;
    }
  }

  async function loadTransactions(userId, currency) {
    const { data, error } = await supabaseClient
      .from("transactions")
      .select("created_at, transaction_type, description, amount")
      .eq("client_id", userId)
      .order("created_at", { ascending: false })
      .limit(10);

    const message = document.getElementById("activityMessage");
    if (error) {
      message.textContent = "Unable to load recent activity.";
      return;
    }
    if (!data || data.length === 0) {
      message.textContent = "No recent activity to display.";
      return;
    }

    document.getElementById("activityTable").style.display = "table";
    message.style.display = "none";
    const rows = document.getElementById("activityRows");
    rows.innerHTML = "";

    data.forEach(function(transaction) {
      const row = document.createElement("tr");
      const date = new Date(transaction.created_at);

      row.innerHTML = `
        <td>${isNaN(date.getTime()) ? "Unknown date" : date.toLocaleDateString()}</td>
        <td>${transaction.transaction_type || "Transaction"}</td>
        <td>${transaction.description || "—"}</td>
        <td>${formatMoney(transaction.amount, currency)}</td>
      `;
      rows.appendChild(row);
    });
  }

  function openWithdrawModal() {
    document.getElementById("withdrawModal").style.display = "flex";
  }

  function closeWithdrawModal() {
    document.getElementById("withdrawModal").style.display = "none";
  }

  async function submitWithdrawal(event) {
    event.preventDefault();
    const crypto = document.getElementById("cryptoType").value;
    const amount = document.getElementById("withdrawAmount").value;
    const address = document.getElementById("walletAddress").value;

    alert(`Withdrawal request of ${amount} via ${crypto} submitted successfully!\nDestination: ${address}\nProcessing may take up to 24 hours.`);
    closeWithdrawModal();
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  loadDashboard();
</script>

</body>
</html>
