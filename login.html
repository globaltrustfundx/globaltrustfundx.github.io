<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Global Trust Fund</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 14px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #D4AF37;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #B8C4D4;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 13px;
      background: #07111F;
      color: #FFFFFF;
      border: 1px solid #203246;
      border-radius: 7px;
      outline: none;
    }

    .field input:focus {
      border-color: #D4AF37;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      background: #D4AF37;
      color: #07111F;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 22px;
      color: #B8C4D4;
    }

    .register-link a {
      color: #D4AF37;
      text-decoration: none;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #B8C4D4;
      text-decoration: none;
      font-size: 14px;
    }
  </style></head><body>  <div class="login-container"><div class="logo">Global Trust Fund</div>

<h1>Welcome Back</h1>
<p class="subtitle">Login to access your account.</p>

<form id="loginForm">

  <div class="field">
    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="username"
      required
    >
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >
  </div>

  <button class="login-button" id="loginButton" type="submit">
    Login
  </button>

</form>

<div class="register-link">
  Don't have an account?
  <a href="register.html">Create one</a>
</div>

<a class="back-home" href="index.html">← Back to Home</a>

  </div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>
    const SUPABASE_URL = "https://xywwhnijjtipghhebnjk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", loginUser);

    async function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.session || !data.user) {
          throw new Error("Login was unsuccessful. Please try again.");
        }

        // Allow the authenticated session to be saved.
        await new Promise(resolve => setTimeout(resolve, 300));

        // Return the client to the normal homepage.
        window.location.replace("index.html");

      } catch (error) {
        alert(error.message || "Unable to log in. Please try again.");

        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    }
  </script></body>
</html>
