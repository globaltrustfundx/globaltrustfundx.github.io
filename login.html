<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Global Trust Fund</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 14px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #D4AF37;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #B8C4D4;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 13px;
      background: #07111F;
      color: #FFFFFF;
      border: 1px solid #203246;
      border-radius: 7px;
      outline: none;
    }

    .field input:focus {
      border-color: #D4AF37;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      background: #D4AF37;
      color: #07111F;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .login-button:hover {
      opacity: 0.9;
    }

    /* SUPPORT CHAT WIDGET BOX */
    .support-box {
      background: #07111F;
      border: 1px solid #203246;
      border-radius: 10px;
      padding: 16px;
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .support-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .support-icon-wrap {
      width: 40px;
      height: 40px;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D4AF37;
      font-size: 18px;
    }
    .support-info h3 { font-size: 14px; margin-bottom: 2px; color: #FFFFFF; }
    .support-info p { color: #94a3b8; font-size: 12px; }
    .btn-chat {
      background: transparent;
      color: #D4AF37;
      border: 1px solid #D4AF37;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-chat:hover { background: #D4AF37; color: #07111F; }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #B8C4D4;
    }

    .register-link a {
      color: #D4AF37;
      text-decoration: none;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #B8C4D4;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">Global Trust Fund</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to access your account.</p>

    <form onsubmit="loginUser(event)">

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>

      <button class="login-button" type="submit">
        Login
      </button>

    </form>

    <!-- LIVE SUPPORT MESSAGE WIDGET -->
    <div class="support-box">
      <div class="support-left">
        <div class="support-icon-wrap">💬</div>
        <div class="support-info">
          <h3>Need Assistance?</h3>
          <p>Chat with our team 24/7</p>
        </div>
      </div>
      <button class="btn-chat" onclick="openLiveChat()">
        💬 Live Chat
      </button>
    </div>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Create one</a>
    </div>

    <a class="back-home" href="index.html">← Back to Home</a>

  </div>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xywwhnijjtipghhebnjk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loginUser(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const button = event.target.querySelector("button[type='submit']");

      button.disabled = true;
      button.textContent = "Logging in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = "Login";
        return;
      }

      if (data.user) {
        window.location.href = "dashboard.html";
      }
    }

    // Trigger Tawk.to Chat Widget open
    function openLiveChat() {
      if (typeof Tawk_API !== 'undefined' && Tawk_API.maximize) {
        Tawk_API.maximize();
      } else {
        alert("Live chat is loading. Please try again in a moment.");
      }
    }
  </script>

  s1.charset='UTF-8';
  s1.setAttribute('crossorigin','*');
  s0.parentNode.insertBefore(s1,s0);
  })();
  </script>
  <!--End of Tawk.to Script-->

</body>
</html>
