<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Global Trust Fund</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111F;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 460px;
      background: #0D1B2A;
      border: 1px solid #203246;
      border-radius: 14px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #D4AF37;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #B8C4D4;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #B8C4D4;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .field input {
      width: 100%;
      padding: 13px;
      background: #07111F;
      color: #FFFFFF;
      border: 1px solid #203246;
      border-radius: 7px;
      outline: none;
    }

    .field input:focus {
      border-color: #D4AF37;
    }

    .register-button {
      width: 100%;
      padding: 13px;
      background: #D4AF37;
      color: #07111F;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }

    .register-button:hover {
      opacity: 0.9;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #B8C4D4;
    }

    .login-link a {
      color: #D4AF37;
      text-decoration: none;
      font-weight: bold;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #B8C4D4;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <div class="logo">Global Trust Fund</div>

    <h1>Create Your Account</h1>
    <p class="subtitle">Register to access your account.</p>

    <form onsubmit="registerUser(event)">

      <div class="field">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          required
        >
      </div>

      <button class="register-button" type="submit">
        Create Account
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back-home" href="index.html">← Back to Home</a>

  </div>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xywwhnijjtipghhebnjk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3hcNCJlDcno7_jcWRihO3g_rYZ6Eim4";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function registerUser(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      const button = event.target.querySelector("button[type='submit']");

      button.disabled = true;
      button.textContent = "Creating Account...";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: name
          },
          emailRedirectTo: "https://globaltrustfundx.github.io/login.html"
        }
      });

      if (error) {
        alert(error.message);
        button.disabled = false;
        button.textContent = "Create Account";
        return;
      }

      if (data.user) {
        alert(
          "Account created successfully. Please check your email and confirm your account before logging in."
        );

        window.location.href = "login.html";
      }
    }
  </script>

</body>
</html>
